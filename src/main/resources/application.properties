# Server Configuration
server.port=${SERVER_PORT:8080}

# Database Configuration (override via env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_habit_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Application Properties
# Provide `APP_JWT_SECRET` in the environment for security
app.jwt.secret=${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Logging Options (can be overridden via env)
logging.level.org.springframework.security=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:INFO}
logging.level.com.tracker.smarthabittracker=${LOGGING_LEVEL_APP:INFO}

# Google Gemini API Settings
google.gemini.api.key=${GOOGLE_GEMINI_API_KEY:AIzaSyDoPPptA_P7C6PXHBY_q4QqKJXezAJcgxM}
