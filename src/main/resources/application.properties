# Server Configuration
server.port=${PORT:${SERVER_PORT:8080}}

# Database Configuration (override via env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smart_habit_tracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT Application Properties
# Provide `APP_JWT_SECRET` in the environment for security
app.jwt.secret=${APP_JWT_SECRET:${JWT_SECRET:dev-secret-key-change-me}}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# CORS Origins (comma-separated). Override in Render for your deployed frontend URL.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}

# Logging Options
logging.level.org.springframework.security=INFO
logging.level.com.tracker.smarthabittracker=INFO

# Google Gemini API Settings
google.gemini.api.key=${GOOGLE_GEMINI_API_KEY:}

# Demo Data
# Disable this in environments where you do not want the app to auto-seed sample content.
app.demo.seed-on-startup=${APP_DEMO_SEED_ON_STARTUP:true}